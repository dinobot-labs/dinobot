name: CI shard comparison
on:
  push:
    branches: [perf/ci-shards-comparison]
permissions:
  contents: read
jobs:
  baseline:
    name: Original discovery baseline
    # Ubuntu 24.04 denied bwrap loopback RTM_NEWADDR in run 39245401168.
    # Use hosted 22.04 for this job; retain the real fail-closed namespace probe.
    # Do not disable AppArmor or user/network namespace isolation.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 63443643053bed6e9c9e1b1b186b1d9e62afd7c3
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          # Cache paths are workspace-relative and differ between hosted and self-hosted runners.
          no-cache: true
      - name: Prepare the required Linux sandbox (no unsandboxed fallback)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap dbus-user-session
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun script/ci/pr-title.ts
      - run: bun run typecheck
      - run: bun script/public-artifact-guard.ts
      - name: Record runtime library layout
        run: ls -ld /bin /lib /lib64 /usr/lib64 && ls -l /usr/lib64/ld-linux*
      - name: Probe the real namespace boundary
        run: >-
          bun -e 'import {runSkillSandbox} from "./src/core/skills/sandbox.ts";
          const result = await runSkillSandbox({fixtureDirectory:process.cwd()+"/test", command:["/usr/bin/true"], timeoutMs:5000, maxOutputBytes:4096, signal:new AbortController().signal});
          console.log(result); if(result.status !== "completed") process.exit(1);'
      - name: Full functional suite without user credentials
        shell: bash
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          mkdir -p "$sandbox/config" "$sandbox/data" "$sandbox/cache"
          mkdir -p reports/baseline
          env HOME="$sandbox" XDG_CONFIG_HOME="$sandbox/config" XDG_DATA_HOME="$sandbox/data" XDG_CACHE_HOME="$sandbox/cache" DINOBOT_NO_UPDATE_CHECK=1 timeout 1200 bun test --path-ignore-patterns '**/tui-perf.test.ts' --reporter=junit --reporter-outfile=reports/baseline/junit.xml
      - name: Upload original discovery JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: original-discovery-6344364
          path: reports/baseline/*
          if-no-files-found: warn
          retention-days: 14

  sharded:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: 63443643053bed6e9c9e1b1b186b1d9e62afd7c3
      functional_shards: '2'
