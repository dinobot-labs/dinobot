name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag to retry (vX.Y.Z)
        required: true
        type: string
      full_verify:
        description: Run the full test suite on the tag source (release events always run it)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication; never cancel an in-flight Cloudflare publish.
concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  source:
    name: Select immutable source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.select.outputs.source_sha }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          # Cache paths are workspace-relative and differ between hosted and self-hosted runners.
          no-cache: true
      - id: select
        env:
          INPUT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bun script/ci/release.ts select

  checks:
    name: Verify release source
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      # Maintainer retries may request build/audit only; published releases always run full CI.
      package_only: ${{ github.event_name == 'workflow_dispatch' && !inputs.full_verify }}
    permissions:
      contents: read

  publish:
    name: Publish audited core tarball to Cloudflare
    needs: [source, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.source.outputs.version }}
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          # Cache paths are workspace-relative and differ between hosted and self-hosted runners.
          no-cache: true
      - name: Bind tag to the tested source
        run: bun script/ci/release.ts verify-tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact_id }}
          path: release-artifact
          merge-multiple: true
      - name: Recheck exact downloaded bytes and payload
        working-directory: release-artifact
        run: |
          sha512sum --check SHA512SUMS
          bun ../script/release-audit.ts "dinobot-$EXPECTED_VERSION.tgz" "$EXPECTED_VERSION"
      - name: Publish and verify immutable Cloudflare artifact
        env:
          CORE_PUBLISH_TOKEN: ${{ secrets.CORE_PUBLISH_TOKEN }}
        run: bun script/ci/publish-cloudflare.ts "release-artifact/dinobot-$EXPECTED_VERSION.tgz" "$EXPECTED_VERSION" "$EXPECTED_SHA"
